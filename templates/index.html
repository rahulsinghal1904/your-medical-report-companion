<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Medical Report Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f9fd;
            color: #1e2a38;
            padding: 30px;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            background-color: #ffffff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 30px;
            color: #2271b1;
        }

        section {
            margin-bottom: 40px;
            padding: 25px;
            background-color: #f0f6fb;
            border-radius: 10px;
        }

        h2, h3 {
            margin-bottom: 15px;
            color: #2c5f88;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #cdd8e3;
            border-radius: 8px;
            background-color: #ffffff;
            color: #1e2a38;
            font-size: 1rem;
        }

        button {
            padding: 14px;
            width: 100%;
            background-color: #2271b1;
            border: none;
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #195c91;
        }

        .pdf-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .upload-container, .pdf-viewer-container {
            flex: 1;
            min-width: 300px;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 2px solid #a4c3da;
            border-radius: 10px;
        }

        .result-content {
            font-size: 1rem;
            line-height: 1.7;
            background-color: #ffffff;
            padding: 15px;
            border: 1px solid #dce5ef;
            border-radius: 10px;
        }

        .chatbot-response-section, #result-section, #response-section {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Your Medical Report Companion</h1>

        <section>
            <h2>📁 Upload & View Report</h2>
            <div class="pdf-container">
                <div class="upload-container">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <input type="file" id="pdfUpload" name="pdf" accept="application/pdf" required />
                        <button type="submit">📤 Analyze Report</button>
                    </form>
                </div>
                <div class="pdf-viewer-container">
                    <iframe id="pdfViewer"></iframe>
                </div>
            </div>
        </section>

        <section id="result-section">
            <h2>🔍 Summary & Findings</h2>
            <div id="summary" class="result-content"></div>
            <br>
            <h2>💡 AI Recommendations</h2>
            <div id="recommendations" class="result-content"></div>
        </section>

        <section>
            <h2>🤖 Chat with HealthBot</h2>
            <textarea id="user-message" placeholder="Ask a health-related question..."></textarea>
            <button onclick="submitChatbotMessage()">💬 Ask Now</button>
            <div class="chatbot-response-section">
                <h3>📽️ Response:</h3>
                <div id="chatbotResponse" class="result-content"></div>
            </div>
        </section>

        <section>
            <h2>🏋️‍♂️ Wellness Advisor</h2>
            <form id="wellnessForm">
                <label>Age</label>
                <input type="number" id="age" placeholder="e.g., 30" required />
                <label>Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g., 70" required />
                <label>Lifestyle</label>
                <select id="lifestyle">
                    <option value="sedentary">Sedentary</option>
                    <option value="active">Active</option>
                    <option value="very_active">Very Active</option>
                </select>
                <label>Gender</label>
                <select id="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <button type="button" onclick="submitWellnessForm()">📈 Get Advice</button>
            </form>
        </section>

        <section id="response-section">
            <h3>🖋️ Personalized Wellness Tips</h3>
            <div id="wellnessAdvice" class="result-content"></div>
        </section>
    </div>

    <script>
        let summaryContext = "";

        document.getElementById("uploadForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const formData = new FormData();
            formData.append("pdf", document.getElementById("pdfUpload").files[0]);

            const response = await fetch("/analyze-report/", { method: "POST", body: formData });
            const data = await response.json();

            document.getElementById("summary").innerHTML = data.summary.replace(/\n/g, "<br>");
            document.getElementById("recommendations").innerHTML = data.health_recommendations.replace(/\n/g, "<br>");
            summaryContext = data.summary;
            document.getElementById("result-section").style.display = "block";

            const fileUrl = URL.createObjectURL(document.getElementById("pdfUpload").files[0]);
            document.getElementById("pdfViewer").src = fileUrl;
        });

        async function submitChatbotMessage() {
            const userMessage = document.getElementById("user-message").value;

            const response = await fetch("/chatbot/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_message: userMessage, context: summaryContext }),
            });

            const data = await response.json();
            document.getElementById("chatbotResponse").innerHTML = data.response.replace(/\n/g, "<br>");
            document.querySelector(".chatbot-response-section").style.display = "block";
        }

        async function submitWellnessForm() {
            const age = document.getElementById("age").value;
            const weight = document.getElementById("weight").value;
            const lifestyle = document.getElementById("lifestyle").value;
            const gender = document.getElementById("gender").value;

            const response = await fetch("/wellness-mode/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ age, weight, lifestyle, gender }),
            });

            const data = await response.json();
            document.getElementById("wellnessAdvice").innerHTML = data.wellness_advice.replace(/\n/g, "<br>");
            document.getElementById("response-section").style.display = "block";
        }
    </script>
</body>
</html>
